name: Build Oskilo

# - main'e her push: testler + Windows/macOS derlemesi (Actions > Artifacts)
# - Yeni sürüm yayınlamak: Actions > "Build Oskilo" > "Run workflow" >
#   sürüm kutusuna örn. v2.1.0 yaz > Run. Sürüm, stm32logger/__init__.py içindeki
#   __version__ ile aynı olmalı. Derleme bitince Releases'a eklenir; README'deki
#   indirme butonları otomatik olarak bu sürümü indirir.
# - Test sürümü: aynı şekilde, "prerelease" kutusunu işaretle. GitHub'da "Pre-release"
#   olarak çıkar, "latest" olmaz; README butonları ve normal kullanıcılar etkilenmez.
#
# Güvenlik:
# - Varsayılan yetki sadece "okuma". Yazma yetkisi yalnızca yayın (release) adımında.
# - Tüm dış GitHub Action'lar değişmez commit SHA'sıyla sabitlendi.
# - Python paketleri requirements-lock.txt'deki SHA-256 parmak izleriyle kurulur.
# - Her dosyanın parmak izi exe'nin yanına (manifest) ve sürüme (SHA256SUMS.txt) eklenir,
#   ayrıca GitHub "derleme kanıtı" (artifact attestation) üretilir.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Yayınlanacak sürüm (örn. v2.1.0). Boş bırakırsan sadece derler, yayınlamaz."
        required: false
        default: ""
      prerelease:
        description: "Test (ön) sürümü olarak yayınla. Sadece 'Test sürümlerini de al' açık olan Oskilo'lar görür."
        type: boolean
        required: false
        default: false

permissions:
  contents: read

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # Bütün testler (çekirdek + arayüz + dayanıklılık) üç işletim sisteminde, pencere göstermeden
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest, macos-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      OSKILO_PERF_FACTOR: "3"          # CI makineleri yavaş/değişken: hız sınırlarına pay
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Sürüm etiketi kontrolü
        if: runner.os == 'Linux' && (inputs.version != '' || startsWith(github.ref, 'refs/tags/v'))
        env:
          VER: ${{ inputs.version || github.ref_name }}
        run: |
          python - <<'EOF'
          import os, re, sys
          from stm32logger import __version__
          tag = os.environ["VER"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+", tag):
              sys.exit(f"Sürüm biçimi vX.Y.Z olmalı (örn. v2.1.0), yazılan: {tag!r}")
          if tag[1:] != __version__:
              sys.exit(f"Sürüm uyuşmuyor: {tag} yazıldı ama stm32logger/__init__.py içinde {__version__} var")
          print("OK", tag)
          EOF
      - name: Qt için sistem kütüphaneleri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Bağımlılıklar (parmak izi kontrollü)
        run: pip install --require-hashes -r requirements-lock.txt
      - name: Testler
        run: python -m pytest -q -ra tests

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bağımlılıklar (parmak izi kontrollü)
        run: pip install --require-hashes -r requirements-lock.txt
      - name: Sürüm bilgisi (exe özellikleri)
        run: python packaging/make_version_info.py packaging/version_info.txt
      - name: Derle (onedir = hızlı açılış)
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir --noupx
          --name "Oskilo"
          --icon assets/icon.ico
          --version-file packaging/version_info.txt
          --add-data "assets;assets" --add-data "LICENSE;."
          --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy
          --exclude-module PIL --exclude-module PyQt5 --exclude-module PyQt6
          --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtPdf --exclude-module PySide6.QtTest --exclude-module PySide6.QtVirtualKeyboard
          main.py
      - name: Kullanılmayan Qt parçalarını çıkar (daha küçük paket, daha hızlı ilk açılış)
        run: python packaging/prune_qt.py dist/Oskilo
      - name: Dosya parmak izleri (manifest)
        run: python packaging/make_manifest.py dist/Oskilo
      - name: Paketi doğrula (DEMO ile uçtan uca test + bütünlük)
        shell: pwsh
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath "dist/Oskilo/Oskilo.exe" -ArgumentList "--selftest","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          if (-not (Select-String -Path selftest.txt -Pattern "integrity=ok" -Quiet)) { exit 1 }
      - name: Gerçek Windows ekran eklentisiyle açılış denemesi (çıkarılan Qt parçaları gerekmiyor mu?)
        shell: pwsh
        timeout-minutes: 2
        run: |
          $p = Start-Process -FilePath "dist/Oskilo/Oskilo.exe" -ArgumentList "--update-probe" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Write-Host "açılış denemesi kodu: $($p.ExitCode)"; exit 1 }
      - name: Uygulama içi güncellemeyi gerçek exe ile dene
        timeout-minutes: 15
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONUTF8: "1"
        run: python packaging/test_update_windows.py dist/Oskilo
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/Oskilo -DestinationPath Oskilo_Windows.zip
      - name: Kurulum programı (Inno Setup, yönetici izni istemez)
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { Write-Host "Inno Setup bulunamadı"; exit 1 }
          $ver = python -c "from stm32logger import __version__; print(__version__)"
          & $iscc "/DMyAppVersion=$ver" "/DSourceDir=$PWD\dist\Oskilo" "/O$PWD" packaging\oskilo.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-Item Oskilo_Setup.exe | Format-List Name, Length
      - name: Kurulumu dene (sessiz kur → aç → kaldır)
        shell: pwsh
        timeout-minutes: 6
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $p = Start-Process -FilePath ".\Oskilo_Setup.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/LOG=kurulum.log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content kurulum.log -Tail 40; exit 1 }
          $app = Join-Path $env:LOCALAPPDATA "Programs\Oskilo"
          if (-not (Test-Path "$app\Oskilo.exe")) { Write-Host "Oskilo.exe kurulmadı"; exit 1 }
          if (-not (Test-Path "$app\_internal\manifest.sha256")) { Write-Host "manifest yok (güncelleme çalışmaz)"; exit 1 }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{C7A79E34-102C-58D8-A91C-73C48CFE1405}_is1"
          $reg = Get-ItemProperty $key
          Write-Host "Uygulamalar listesi: $($reg.DisplayName) $($reg.DisplayVersion) -> $($reg.InstallLocation)"
          $lnk = Join-Path $env:APPDATA "Microsoft\Windows\Start Menu\Programs\Oskilo.lnk"
          if (-not (Test-Path $lnk)) { Write-Host "Başlat menüsü kısayolu yok"; exit 1 }
          $p = Start-Process -FilePath "$app\Oskilo.exe" -ArgumentList "--selftest","$PWD\selftest_kurulu.txt" -Wait -PassThru
          Get-Content selftest_kurulu.txt
          if ($p.ExitCode -ne 0) { exit 1 }
          New-Item -ItemType File "$app\_oskilo_new\yazma.tmp" -Force | Out-Null
          Start-Process -FilePath "$app\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path $app) -or (Test-Path $key)); $i++) { Start-Sleep -Seconds 1 }
          if (Test-Path $app) { Write-Host "klasör kaldı:"; Get-ChildItem $app -Recurse | Select-Object -First 20; exit 1 }
          if (Test-Path $key) { Write-Host "Uygulamalar kaydı kaldı"; exit 1 }
          if (Test-Path $lnk) { Write-Host "kısayol kaldı"; exit 1 }
          Write-Host "kur / aç / kaldır: tamam"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Oskilo_Windows
          path: |
            Oskilo_Windows.zip
            Oskilo_Setup.exe

  build-macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Bağımlılıklar (parmak izi kontrollü)
        run: pip install --require-hashes -r requirements-lock.txt
      - name: Derle
        run: >
          pyinstaller --noconfirm --clean --windowed --onedir --noupx
          --name "Oskilo"
          --icon assets/icon.icns
          --add-data "assets:assets" --add-data "LICENSE:."
          --osx-bundle-identifier "com.mhmtcndsgn.datalogger"
          --exclude-module tkinter --exclude-module matplotlib --exclude-module scipy
          --exclude-module PIL --exclude-module PyQt5 --exclude-module PyQt6
          --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtPdf --exclude-module PySide6.QtTest --exclude-module PySide6.QtVirtualKeyboard
          main.py
      - name: Paketi doğrula (DEMO ile uçtan uca test)
        timeout-minutes: 3
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          "dist/Oskilo.app/Contents/MacOS/Oskilo" --selftest selftest.txt
          cat selftest.txt
      - name: DMG
        run: |
          mkdir -p dmg && cp -R "dist/Oskilo.app" dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname "Oskilo" -srcfolder dmg -ov -format UDZO Oskilo_macOS.dmg
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Oskilo_macOS
          path: Oskilo_macOS.dmg

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.version != '')
    needs: [ build-windows, build-macos ]
    runs-on: ubuntu-latest
    permissions:
      contents: write       # sürümü oluşturmak için
      id-token: write       # derleme kanıtı (attestation) imzası için
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: assets_out
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: assets_out
        run: |
          sha256sum Oskilo_Setup.exe Oskilo_Windows.zip Oskilo_macOS.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Derleme kanıtı (artifact attestation)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            assets_out/Oskilo_Setup.exe
            assets_out/Oskilo_Windows.zip
            assets_out/Oskilo_macOS.dmg
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: "Oskilo ${{ inputs.version || github.ref_name }}"
          prerelease: ${{ inputs.prerelease == true }}
          make_latest: ${{ inputs.prerelease == true && 'false' || 'true' }}
          body: |
            ## Download / İndir

            | | |
            |---|---|
            | 🖥️ **Windows 10/11 (recommended / önerilen)** | `Oskilo_Setup.exe` → run → Next. No admin rights needed. If SmartScreen appears: **More info → Run anyway** |
            | 🖥️ **Windows (portable / kurulumsuz)** | `Oskilo_Windows.zip` → right-click → **Properties → Unblock** → extract → `Oskilo.exe` |
            | 🍎 **macOS (Apple Silicon)** | `Oskilo_macOS.dmg` → drag to Applications → first launch: **System Settings → Privacy & Security → Open Anyway** |

            **TR:** Windows'ta en kolayı `Oskilo_Setup.exe`: çalıştır → İleri. Yönetici izni istemez; Başlat menüsüne eklenir, "Uygulamalar"dan kaldırılır, uygulama içinden güncellenir. Mavi "Windows bilgisayarınızı korudu" penceresi çıkarsa **Ek bilgi → Yine de çalıştır**. Kurulumsuz kullanmak istersen zip'e sağ tıkla → **Özellikler → Engellemeyi kaldır** → Tamam, sonra çıkar. Böylece "açmak istiyor musunuz" uyarısı çıkmaz. macOS'ta ilk açılışta **Sistem Ayarları → Gizlilik ve Güvenlik → Yine de Aç**.

            ### Verify the download / İndirmeyi doğrula
            - `SHA256SUMS.txt` lists the SHA-256 fingerprint of each file. / Her dosyanın parmak izi `SHA256SUMS.txt` içinde.
              Windows: `Get-FileHash Oskilo_Setup.exe` · macOS: `shasum -a 256 Oskilo_macOS.dmg`
            - Built by GitHub Actions from this repository (build provenance): `gh attestation verify Oskilo_Windows.zip -R mhmtcndsgn/Oskilo`
            - In the app / Uygulamada: **? → About / Hakkında → Verify files / Dosyaları doğrula**
          files: |
            assets_out/Oskilo_Setup.exe
            assets_out/Oskilo_Windows.zip
            assets_out/Oskilo_macOS.dmg
            assets_out/SHA256SUMS.txt
